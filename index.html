<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Learn How to Use Social Media & AI</title>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --navy:#233A66; --navy-dark:#152444; --coral:#F2704B; --coral-dark:#D6572F;
    --cream:#FBF6EE; --teal:#2FA0A0; --gold:#F4B740; --ink:#20263B;
    --card:#FFFFFF; --line:#E7E0D2; --radius:18px; --font-scale:1;
  }
  * { box-sizing:border-box; }
  html{ font-size: calc(16px * var(--font-scale)); }
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height:1.55; color:var(--ink); margin:0; padding:10px 0;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  [dir="rtl"] body{ direction:rtl; }
  .app{ width:100%; max-width:420px; background:var(--cream); border-radius:24px;
    overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.4); min-height:96vh; }
  .container{ padding:18px; }
  .screen{ display:none; animation:fadeIn .35s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- HOME ---------- */
  .hero{ background:linear-gradient(135deg, var(--navy) 0%, #1c2f56 100%); color:white;
    padding:30px 20px 26px; text-align:center; border-radius:0 0 28px 28px; }
  .hero-badge{ font-size:2.6rem; margin-bottom:6px; }
  .hero h1{ font-size:1.5rem; margin:6px 0 10px; line-height:1.3; }
  .hero h1 span{ color:var(--gold); }
  .hero p{ font-size:1rem; opacity:.92; margin:0; }
  .toolbar{ display:flex; justify-content:center; gap:10px; margin-top:16px; }
  .toolbar button{ background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.35);
    color:white; border-radius:14px; padding:8px 14px; font-size:.95rem; cursor:pointer; }
  .toolbar button:hover{ background:rgba(255,255,255,0.28); }

  .platforms-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:18px; }
  .platform-card{ background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
    padding:18px 10px; text-align:center; cursor:pointer; min-height:118px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 6px 16px rgba(35,58,102,0.08); position:relative; transition:transform .15s; }
  .platform-card:active{ transform:scale(.97); }
  .platform-card.ai-card{ border-color:var(--teal); background:linear-gradient(160deg,#fff, #EAF7F7); }
  .ai-tag{ position:absolute; top:8px; right:8px; background:var(--teal); color:white;
    font-size:.65rem; padding:3px 7px; border-radius:10px; font-weight:700; }
  .platform-icon{ font-size:2.1rem; width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; }
  .platform-icon__img{ width:60%; height:60%; object-fit:contain; }
  .platform-icon__img--invert{ filter:invert(1); }
  .platform-card h3{ margin:0; font-size:.95rem; color:var(--ink); }
  .progress-pill{ font-size:.7rem; color:var(--coral-dark); font-weight:700; }

  /* platform colors */
  .pc-facebook .platform-icon{ background:#E7EFFD; color:#1877F2; }
  .pc-instagram .platform-icon{ background:linear-gradient(45deg,#fde3d5,#f5d0e0); color:#C13584; }
  .pc-tiktok .platform-icon{ background:#000; color:#fff; }
  .pc-youtube .platform-icon{ background:#FDE3E3; color:#FF0000; }
  .pc-whatsapp .platform-icon{ background:#E1F7E8; color:#25D366; }
  .pc-messenger .platform-icon{ background:#E3F1FF; color:#0084FF; }
  .pc-chatgpt .platform-icon, .pc-gemini .platform-icon, .pc-metaai .platform-icon{
    background:#E5F7F7; color:var(--teal); }

  /* ---------- COURSE ---------- */
  .top-bar{ display:flex; align-items:center; gap:10px; padding:16px 16px 0; }
  .icon-btn{ background:var(--navy); color:white; border:none; width:44px; height:44px;
    border-radius:14px; font-size:1.1rem; cursor:pointer; flex-shrink:0; }
  .course-header{ background:var(--card); border-radius:var(--radius); padding:20px; margin:14px 16px;
    box-shadow:0 6px 16px rgba(35,58,102,0.08); }
  .course-header h2{ margin:0 0 8px; font-size:1.25rem; color:var(--navy); }
  .course-header p{ margin:0; color:#555; font-size:.92rem; }

  .profile-stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 16px; }
  .stat-card{ background:linear-gradient(135deg, var(--navy), #2b477e); color:white; border-radius:14px;
    padding:14px 8px; text-align:center; }
  .stat-number{ font-size:1.4rem; font-weight:800; }
  .stat-label{ font-size:.72rem; opacity:.9; }

  .levels-list{ padding:4px 16px 24px; display:flex; flex-direction:column; gap:14px; }
  .level-card{ background:var(--card); border-radius:16px; padding:18px; box-shadow:0 6px 16px rgba(35,58,102,0.08);
    display:flex; gap:14px; align-items:center; border:2px solid transparent; cursor:pointer; }
  .level-card.locked{ opacity:.55; cursor:not-allowed; }
  .level-card.done{ border-color:#3FAE58; }
  .level-num{ width:46px; height:46px; border-radius:50%; background:var(--coral); color:white;
    display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; font-size:1.1rem; }
  .level-card.locked .level-num{ background:#B7BDC9; }
  .level-body h3{ margin:0 0 4px; font-size:1.02rem; color:var(--ink); }
  .level-body p{ margin:0 0 6px; font-size:.85rem; color:#666; }
  .level-meta{ display:flex; gap:10px; font-size:.78rem; color:var(--coral-dark); font-weight:700; }
  .lock-flag{ margin-left:auto; font-size:1.3rem; }

  /* ---------- MODAL ---------- */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(20,25,45,0.82); z-index:1500;
    align-items:center; justify-content:center; padding:14px; }
  .modal-overlay.active{ display:flex; }
  .modal-box{ background:var(--card); width:100%; max-width:400px; max-height:88vh; overflow-y:auto;
    border-radius:22px; padding:22px; position:relative; }
  .modal-close{ position:absolute; top:14px; right:16px; font-size:1.6rem; background:none; border:none;
    color:#999; cursor:pointer; line-height:1; }
  [dir="rtl"] .modal-close{ right:auto; left:16px; }

  .step-progress{ display:flex; gap:6px; margin:6px 0 18px; }
  .step-dot{ flex:1; height:6px; border-radius:4px; background:var(--line); }
  .step-dot.filled{ background:var(--coral); }
  .step-icon{ width:88px; height:88px; border-radius:24px; background:linear-gradient(135deg,var(--navy),#2b477e);
    color:white; font-size:2.6rem; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }

  /* ---------- PHONE-MOCKUP STEP VISUAL (image-free, works for non-readers) ---------- */
  .phone-mock{ width:190px; height:240px; margin:0 auto 16px; background:#1b2338; border-radius:28px;
    padding:12px 10px; box-shadow:0 12px 28px rgba(0,0,0,.28); position:relative; }
  .phone-mock__notch{ width:52px; height:6px; background:#0d1220; border-radius:4px; margin:0 auto 10px; }
  .phone-mock__screen{ background:#fff; border-radius:18px; height:calc(100% - 20px); position:relative;
    display:flex; align-items:center; justify-content:center; overflow:visible; }
  .phone-mock__ring{ position:absolute; width:78px; height:78px; border-radius:50%; border:4px solid var(--coral);
    opacity:.7; animation:ringPulse 1.7s infinite; z-index:1; }
  .phone-mock__icon{ width:78px; height:78px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:2.15rem; color:#fff; position:relative; z-index:2; }
  @keyframes ringPulse{ 0%{ transform:scale(1); opacity:.75; } 100%{ transform:scale(1.7); opacity:0; } }
  .phone-mock__gesture{ position:absolute; font-size:1.9rem; z-index:3; }
  .phone-mock__gesture.tap{ right:10px; bottom:14px; animation:tapBounce 1.1s infinite; }
  .phone-mock__gesture.type{ right:10px; bottom:10px; }
  .phone-mock__gesture.read{ right:10px; bottom:14px; animation:softFade 1.8s infinite; }
  .phone-mock__gesture.swipe{ left:50%; bottom:16px; transform:translateX(-50%); animation:swipeMove 1.5s infinite; }
  @keyframes tapBounce{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-8px,-8px); } }
  @keyframes softFade{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
  @keyframes swipeMove{ 0%{ transform:translate(-50%,16px); opacity:0; } 50%{ opacity:1; } 100%{ transform:translate(-50%,-16px); opacity:0; } }

  /* ---------- Realistic mini UI mockup with a RED "click here" highlight ---------- */
  .ui-screen{ width:100%; height:100%; display:flex; flex-direction:column; justify-content:center;
    gap:10px; padding:8px 12px; }
  .ui-row{ height:42px; border-radius:10px; background:#EEF0F4; display:flex; align-items:center;
    justify-content:flex-start; gap:10px; padding:0 14px; position:relative; flex-shrink:0; }
  .ui-row__emoji{ font-size:1.2rem; flex-shrink:0; }
  .ui-row__label{ font-size:.92rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ui-row--hot{ box-shadow:0 0 0 3px #FF3B30, 0 0 0 8px rgba(255,59,48,.28); animation:hotPulse 1.3s infinite; }
  @keyframes hotPulse{
    0%,100%{ box-shadow:0 0 0 3px #FF3B30, 0 0 0 6px rgba(255,59,48,.30); }
    50%{ box-shadow:0 0 0 3px #FF3B30, 0 0 0 12px rgba(255,59,48,.06); } }
  .ui-row__hand{ position:absolute; right:-10px; bottom:-16px; font-size:1.5rem; animation:tapBounce 1.1s infinite; }
  .type-cue{ text-align:center; font-size:1.4rem; margin-top:2px; opacity:.85; }
  .phone-mock--photo{ background:#000; }
  .phone-mock__screen--photo{ padding:0; overflow:hidden; }
  .lesson-image{ width:100%; max-width:320px; height:220px; object-fit:contain; background:#fff;
    border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.12); margin:0 auto 16px; display:block;
    border:3px solid #f0f0f0; padding:10px; }
  .simple-visual{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .simple-visual__iconwrap{ position:relative; width:78px; height:78px; }
  .simple-visual__label{ font-size:1.05rem; font-weight:700; color:#233A66; text-align:center; }
  /* Real emoji images (Twemoji) instead of relying on the device's font */
  img.emoji{ height:1em; width:1em; margin:0 .05em 0 .1em; vertical-align:-0.15em; }
  .step-title{ text-align:center; font-size:1.15rem; font-weight:700; color:var(--navy); margin-bottom:10px; }
  .step-content{ text-align:center; font-size:1.02rem; color:var(--ink); padding:0 6px; min-height:60px; }
  .lesson-nav{ display:flex; gap:10px; margin-top:22px; }
  .nav-btn{ flex:1; padding:14px; border:none; border-radius:16px; font-size:1rem; font-weight:700; cursor:pointer; }
  .nav-btn.prev{ background:#EDEDED; color:#444; }
  .nav-btn.next{ background:var(--coral); color:white; }
  .nav-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .speak-step-btn{ display:block; margin:0 auto 14px; background:var(--teal); color:white; border:none;
    border-radius:14px; padding:8px 16px; font-size:.9rem; cursor:pointer; }

  .reward-box{ text-align:center; padding:10px; }
  .reward-stars{ font-size:2.6rem; }
  .reward-points{ font-size:1.6rem; color:#3FAE58; font-weight:800; margin:14px 0; }

  .lang-grid{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .lang-btn{ padding:14px; border-radius:14px; border:2px solid var(--line); background:white;
    font-size:1.05rem; text-align:left; cursor:pointer; }
  [dir="rtl"] .lang-btn{ text-align:right; }
  .lang-btn.active{ border-color:var(--coral); background:#FFF3EE; }

  /* ---------- ACCESSIBILITY TOOLBAR ---------- */
  .fab-group{ position:fixed; bottom:20px; right:16px; z-index:1800; display:flex; flex-direction:column; gap:10px; }
  [dir="rtl"] .fab-group{ right:auto; left:16px; }
  .fab{ width:60px; height:60px; border-radius:50%; border:none; box-shadow:0 8px 20px rgba(0,0,0,0.35);
    font-size:1.5rem; cursor:pointer; color:white; }
  .fab-speak{ background:linear-gradient(45deg,#2FA0A0,#1c7c7c); }
  .fab-speak.speaking{ background:linear-gradient(45deg,#ff6b6b,#ee5253); }
  .fab-text{ background:var(--navy); font-size:1rem; font-weight:800; }

  @media (max-width:360px){ .app{ border-radius:0; } .platform-icon{ width:48px; height:48px; font-size:1.8rem; } }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="app" id="app-root">

  <!-- ===================== HOME ===================== -->
  <section id="screen-home" class="screen active">
    <div class="hero">
      <div class="hero-badge">🌟</div>
      <h1><span data-i18n="app_title">Learn Social Media & AI</span></h1>
      <p data-i18n="main_goal">Choose an app below and learn step by step, with pictures and audio.</p>
      <div class="toolbar">
        <button onclick="openLanguageModal()">🌐 <span data-i18n="language_btn">Language</span></button>
        <button onclick="changeFontScale(0.1)">A+</button>
        <button onclick="changeFontScale(-0.1)">A-</button>
      </div>
    </div>
    <div class="platforms-grid" id="platforms-grid"></div>

    <div class="profile-stats">
      <div class="stat-card"><div class="stat-number" id="stat-points">0</div><div class="stat-label" data-i18n="total_points">Total Points</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-lessons">0</div><div class="stat-label" data-i18n="lessons_completed">Lessons Completed</div></div>
    </div>
  </section>

  <!-- ===================== COURSE ===================== -->
  <section id="screen-course" class="screen">
    <div class="top-bar">
      <button class="icon-btn" onclick="showHome()">⬅️</button>
      <button class="icon-btn" onclick="speakVisible()">🔊</button>
    </div>
    <div class="course-header">
      <h2 id="course-title"></h2>
      <p id="course-intro"></p>
    </div>
    <div class="levels-list" id="levels-list"></div>
  </section>
</div>

<!-- ===================== LESSON MODAL ===================== -->
<div class="modal-overlay" id="lesson-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLesson()">&times;</button>
    <div class="step-progress" id="step-progress"></div>
    <button class="speak-step-btn" onclick="speakVisible()">🔊 <span data-i18n="read_aloud">Read Aloud</span></button>
    <div id="step-visual"></div>
    <div class="step-title" id="step-title"></div>
    <div class="step-content" id="step-content"></div>
    <div class="lesson-nav">
      <button class="nav-btn prev" id="btn-prev" onclick="prevStep()" data-i18n="prev_btn">Back</button>
      <button class="nav-btn next" id="btn-next" onclick="nextStep()" data-i18n="next_btn">Next</button>
    </div>
  </div>
</div>

<!-- ===================== REWARD MODAL ===================== -->
<div class="modal-overlay" id="reward-modal">
  <div class="modal-box reward-box">
    <button class="modal-close" onclick="closeReward()">&times;</button>
    <div class="reward-stars">⭐⭐⭐⭐⭐</div>
    <h2 data-i18n="congratulations">Congratulations!</h2>
    <p id="reward-message"></p>
    <div class="reward-points">+<span id="reward-points">100</span> <span data-i18n="points_word">Points</span></div>
    <div class="lesson-nav">
      <button class="nav-btn next" style="flex:1" onclick="closeReward()" data-i18n="continue_learning">Continue Learning</button>
    </div>
  </div>
</div>

<!-- ===================== LANGUAGE MODAL ===================== -->
<div class="modal-overlay" id="language-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLanguageModal()">&times;</button>
    <h2 data-i18n="select_language" style="text-align:center;">Select Your Language</h2>
    <div class="lang-grid" id="lang-grid"></div>
  </div>
</div>

<!-- ===================== FLOATING ACCESSIBILITY BUTTONS ===================== -->
<div class="fab-group">
  <button class="fab fab-speak" id="fab-speak" onclick="toggleSpeak()" aria-label="Read screen aloud">🔊</button>
</div>

<script>
/* =====================================================================
   1. TRANSLATIONS  (english / spanish / french / bangla / arabic / chinese)
   ===================================================================== */
const LANGS = {
  english:{ bcp47:"en-US", dir:"ltr", label:"🇺🇸 English" },
  spanish:{ bcp47:"es-ES", dir:"ltr", label:"🇪🇸 Español" },
  french:{ bcp47:"fr-FR", dir:"ltr", label:"🇫🇷 Français" },
  bangla:{ bcp47:"bn-BD", dir:"ltr", label:"🇧🇩 বাংলা" },
  arabic:{ bcp47:"ar-SA", dir:"rtl", label:"🇸🇦 العربية" },
  chinese:{ bcp47:"zh-CN", dir:"ltr", label:"🇨🇳 中文" },
};

const S = {

  congratulations:{ english:"Congratulations!", spanish:"¡Felicidades!", french:"Félicitations !", bangla:"অভিনন্দন!", arabic:"تهانينا!", chinese:"恭喜！" },
  continue_learning:{ english:"Continue Learning", spanish:"Seguir Aprendiendo", french:"Continuer à Apprendre", bangla:"শেখা চালিয়ে যান", arabic:"متابعة التعلم", chinese:"继续学习" },
  points_word:{ english:"Points", spanish:"Puntos", french:"Points", bangla:"পয়েন্ট", arabic:"نقاط", chinese:"积分" },
  select_language:{ english:"Select Your Language", spanish:"Selecciona tu Idioma", french:"Choisissez votre Langue", bangla:"আপনার ভাষা নির্বাচন করুন", arabic:"اختر لغتك", chinese:"选择你的语言" },

    step_enter_info: "https://cdn-icons-png.flaticon.com/512/847/847969.png",
    step_find_friends: "https://cdn-icons-png.flaticon.com/512/482/482631.png",
    step_tap_follow_add: "https://img.icons8.com/color/512/plus-math.png",
    step_open_feed: "https://cdn-icons-png.flaticon.com/512/1087/1087815.png",
  },
  chatgpt: {
    step_open_ai_app: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/ChatGPT_logo.svg/512px-ChatGPT_logo.svg.png",
    step_type_question: "https://cdn-icons-png.flaticon.com/512/616/616487.png",
  },
  tiktok: { step_open_app: "https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/tiktok.svg" },
  youtube: { step_watch_video: "https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/youtube.svg" },
  whatsapp: { step_open_app: "https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/whatsapp.svg" },
  messenger: { step_open_chat: "https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/messenger.svg" },
  gemini: { step_open_ai_app: "https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/googlegemini.svg" },
  metaai: { step_open_ai_app: "https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/meta.svg" },
  // Add more here the same way — anything not listed just falls back to
  // the drawn phone-mockup automatically, so it's always safe to extend.
};

function renderStepVisual(key, platformKey){
  const customImage = STEP_IMAGES[platformKey] && STEP_IMAGES[platformKey][key];
  if (customImage){
    // A real photo/screenshot, shown big and full-width — like your
    // original file's lesson-image style — not squeezed into a small mockup.
    return `<img src="${customImage}" alt="" class="lesson-image"
      onerror="this.outerHTML = renderStepVisual('${key}', null)">`;
  }
  const v = STEP_VISUALS[key] || { mode:"click", rows:[{emoji:"👆"}], hot:0 };
  let inner;

  if (v.mode === "click"){
    // Realistic-looking rows (like real form fields/buttons), each with a
    // real text label — e.g. "Password", "Sign Up" — not just an icon. The
    // correct one to tap is outlined in RED with a glow and a hand.
    inner = `<div class="ui-screen">` + v.rows.map((r, i) => {
      const isHot = i === v.hot;
      const bg = r.muted ? "#EEF0F4" : (isHot ? "#FF3B30" : "#233A66");
      const textColor = r.muted ? "#5B6472" : "#fff";
      return `<div class="ui-row ${isHot ? "ui-row--hot" : ""}" style="background:${bg}">
        <span class="ui-row__emoji">${r.emoji}</span>
        <span class="ui-row__label" style="color:${textColor}">${t(r.label)}</span>
        ${isHot ? `<span class="ui-row__hand">👆</span>` : ""}
      </div>`;
    }).join("") + `</div>`;
  } else if (v.mode === "type"){
    inner = `<div class="ui-screen">` +
      v.rows.map(r => `<div class="ui-row" style="background:#EEF0F4">
        <span class="ui-row__emoji">${r.emoji}</span>
        <span class="ui-row__label" style="color:#5B6472">${t(r.label)}</span>
      </div>`).join("") +
      `<div class="type-cue">⌨️</div></div>`;
  } else {
    // simple centered icon fallback (read / swipe / informational steps),
    // now with a real text label underneath (e.g. "Warning", "Answer").
    const gestureHtml = v.gesture && v.gesture !== "none"
      ? `<div class="phone-mock__gesture ${v.gesture}">${GESTURE_EMOJI[v.gesture]}</div>` : "";
    inner = `<div class="simple-visual">
      <div class="simple-visual__iconwrap">
        <div class="phone-mock__ring" style="border-color:${v.color}"></div>
        <div class="phone-mock__icon" style="background:${v.color}"><span class="ui-row__emoji">${v.emoji}</span></div>
        ${gestureHtml}
      </div>
      <div class="simple-visual__label">${t(v.label)}</div>
    </div>`;
  }

  return `<div class="phone-mock"><div class="phone-mock__notch"></div>
    <div class="phone-mock__screen">${inner}</div></div>`;
}

/* =====================================================================
   3. STATE (persisted with localStorage)
   ===================================================================== */
let state = JSON.parse(localStorage.getItem("lc_state") || "null") || {
  points:0, completed:{}, unlocked:{}, // unlocked["ig-2"] = true once bought with points
};
// Migrate older saved progress that predates the "unlocked" field
if (!state.completed) state.completed = {};
if (!state.unlocked) state.unlocked = {};
if (typeof state.points !== "number") state.points = 0;
function saveState(){ localStorage.setItem("lc_state", JSON.stringify(state)); }

let fontScale = parseFloat(localStorage.getItem("lc_font") || "1");
document.documentElement.style.setProperty("--font-scale", fontScale);
function changeFontScale(delta){
  fontScale = Math.min(1.4, Math.max(0.85, fontScale + delta));
  document.documentElement.style.setProperty("--font-scale", fontScale);
  localStorage.setItem("lc_font", fontScale);
}

/* =====================================================================
   4. RENDERING
   ===================================================================== */
function renderHome(){
  const grid = document.getElementById("platforms-grid");
  grid.innerHTML = "";
  Object.entries(PLATFORMS).forEach(([key, p]) => {
    const totalLevels = p.levels.length;
    const doneLevels = p.levels.filter(l => state.completed[l.id]).length;
    const card = document.createElement("div");
    card.className = "platform-card " + p.cls + (p.ai ? " ai-card" : "");
    card.onclick = () => openPlatform(key);
    card.innerHTML = `
      ${p.ai ? `<div class="ai-tag">AI</div>` : ""}
      <div class="platform-icon">${p.logo
      ? `<img src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/${p.logo}.svg" alt="" class="platform-icon__img${p.invert ? ' platform-icon__img--invert' : ''}" onerror="this.outerHTML='${p.emoji}'">`
      : p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="progress-pill">${doneLevels}/${totalLevels} ✅</div>`;
    grid.appendChild(card);
  });
  document.getElementById("stat-points").textContent = state.points;
  document.getElementById("stat-lessons").textContent = Object.keys(state.completed).length;
  refreshEmoji();
}

let activePlatformKey = null;
function openPlatform(key){
  activePlatformKey = key;
  const p = PLATFORMS[key];
  document.getElementById("course-title").textContent = p.name;
  document.getElementById("course-intro").textContent = t(p.intro);
  const list = document.getElementById("levels-list");
  list.innerHTML = "";
  p.levels.forEach((lvl, idx) => {
    const cost = idx === 0 ? 0 : p.levels[idx-1].points; // unlock cost = points earned from the previous level
    const isDone = !!state.completed[lvl.id];
    const isUnlocked = idx === 0 || isDone || !!state.unlocked[lvl.id];
    const canAfford = state.points >= cost;
    const card = document.createElement("div");
    card.className = "level-card" + (!isUnlocked ? " locked" : "") + (isDone ? " done" : "");
    card.onclick = () => {
      if (isUnlocked){ openLesson(key, lvl.id); return; }
      if (!canAfford){ showToast(t("need_more_points", { n: cost - state.points })); return; }
      if (confirm(t("confirm_unlock", { n: cost }))){
        state.points -= cost;
        state.unlocked[lvl.id] = true;
        saveState();
        openPlatform(key);
      }
    };
    const lockLine = !isUnlocked
      ? `<div class="level-meta" style="color:${canAfford ? '#3FAE58' : '#C0392B'}">${canAfford ? t("unlock_for_points",{n:cost}) : t("points_short",{n:cost - state.points})}</div>`
      : "";
    card.innerHTML = `
      <div class="level-num">${isDone ? "✅" : (idx+1)}</div>
      <div class="level-body">
        <h3>${t(lvl.titleKey)}</h3>
        <div class="level-meta"><span>⭐ ${lvl.points} pts</span><span>${lvl.difficulty}</span></div>
        ${lockLine}
      </div>
      ${!isUnlocked ? `<div class="lock-flag">🔒</div>` : ""}`;
    list.appendChild(card);
  });
  showScreen("screen-course");
  refreshEmoji();
}

function showHome(){ renderHome(); showScreen("screen-home"); }
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---- lesson modal ---- */
let activeLesson = null, activeStep = 0;
function openLesson(platformKey, levelId){
  const p = PLATFORMS[platformKey];
  const lvl = p.levels.find(l => l.id === levelId);
  activeLesson = { platformKey, lvl, appName: p.name };
  activeStep = 0;
  renderStep();
  document.getElementById("lesson-modal").classList.add("active");
}
function closeLesson(){
  document.getElementById("lesson-modal").classList.remove("active");
  AppSpeech.stop();
  activeLesson = null;
}
function renderStep(){
  const { lvl, appName } = activeLesson;
  const steps = lvl.steps;
  const key = steps[activeStep];
  document.getElementById("step-visual").innerHTML = renderStepVisual(key, activeLesson.platformKey);
  document.getElementById("step-title").textContent = t(lvl.titleKey) + " (" + (activeStep+1) + "/" + steps.length + ")";
  document.getElementById("step-content").textContent = t(key, { app: appName });

  const dots = document.getElementById("step-progress");
  dots.innerHTML = "";
  steps.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "step-dot" + (i <= activeStep ? " filled" : "");
    dots.appendChild(d);
  });

  document.getElementById("btn-prev").disabled = activeStep === 0;
  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = (activeStep === steps.length - 1) ? t("finish_btn") : t("next_btn");
  AppSpeech.stop();
  refreshEmoji();
}
function prevStep(){ if (activeStep > 0){ activeStep--; renderStep(); } }
function nextStep(){
  const steps = activeLesson.lvl.steps;
  if (activeStep < steps.length - 1){ activeStep++; renderStep(); }
  else { finishLesson(); }
}
function finishLesson(){
  const { lvl } = activeLesson;
  const already = !!state.completed[lvl.id];
  if (!already){
    state.completed[lvl.id] = true;
    state.points += lvl.points;
    saveState();
  }
  document.getElementById("lesson-modal").classList.remove("active");
  document.getElementById("reward-points").textContent = already ? 0 : lvl.points;
  document.getElementById("reward-message").textContent = t("lesson_complete_msg");
  document.getElementById("reward-modal").classList.add("active");
}
function closeReward(){
  document.getElementById("reward-modal").classList.remove("active");
  openPlatform(activeLesson.platformKey);
}

/* ---- language modal ---- */
function openLanguageModal(){
  const grid = document.getElementById("lang-grid");
  grid.innerHTML = "";
  Object.entries(LANGS).forEach(([key, meta]) => {
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (key === currentLang ? " active" : "");
    btn.textContent = meta.label;
    btn.onclick = () => { setLanguage(key); closeLanguageModal(); };
    grid.appendChild(btn);
  });
  const checkBtn = document.createElement("button");
  checkBtn.className = "lang-btn";
  checkBtn.style.cssText = "border-style:dashed;color:#666;font-size:.85rem;";
  checkBtn.textContent = "🔍 Check voices installed on this device";
  checkBtn.onclick = showInstalledVoices;
  grid.appendChild(checkBtn);
  document.getElementById("language-modal").classList.add("active");
  refreshEmoji();
}
async function showInstalledVoices(){
  const voices = await AppSpeech.waitForVoices();
  if (!voices.length){ showToast("This browser reports no voices at all — read-aloud may not work here."); return; }
  const langsFound = [...new Set(voices.map(v => v.lang))].sort();
  const supported = Object.values(LANGS).map(l => l.bcp47);
  const have = supported.filter(code => langsFound.some(l => l.toLowerCase().startsWith(code.split("-")[0].toLowerCase())));
  const missing = supported.filter(code => !have.includes(code));
  let msg = "Voices found on this device: " + langsFound.join(", ") + ".\n\n";
  msg += "App languages WITH real speech: " + (have.length ? have.map(c => LANGS_BY_CODE(c)).join(", ") : "none") + "\n";
  msg += "App languages that will fall back to a default voice: " + (missing.length ? missing.map(c => LANGS_BY_CODE(c)).join(", ") : "none");
  alert(msg);
}
function LANGS_BY_CODE(code){
  const found = Object.values(LANGS).find(l => l.bcp47 === code);
  return found ? found.label : code;
}
function closeLanguageModal(){ document.getElementById("language-modal").classList.remove("active"); }
function setLanguage(lang){
  currentLang = lang;
  localStorage.setItem("lc_lang", lang);
  const meta = LANGS[lang];
  document.documentElement.setAttribute("lang", meta.bcp47.split("-")[0]);
  document.documentElement.setAttribute("dir", meta.dir);
  applyStaticTranslations();
  renderHome();
  if (activePlatformKey && document.getElementById("screen-course").classList.contains("active")) openPlatform(activePlatformKey);
  if (activeLesson) renderStep();
}
function applyStaticTranslations(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
}

/* =====================================================================
   5. READ ALOUD (TEXT-TO-SPEECH)
   Uses the phone/browser's built-in voice now. If you later add a cloud
   voice backend, set window.CLOUD_TTS_ENDPOINT to a URL that accepts
   { text, language } and returns an audio file — this code will use it
   automatically and fall back to the free voice if it's unavailable.
   ===================================================================== */
const AppSpeech = {
  synth: window.speechSynthesis, audio:null, speaking:false, rate:0.85,
  voicesReady:false,
  waitForVoices(){
    return new Promise(resolve => {
      const existing = this.synth ? this.synth.getVoices() : [];
      if (existing.length > 0){ resolve(existing); return; }
      if (!this.synth){ resolve([]); return; }
      const timeout = setTimeout(() => resolve(this.synth.getVoices()), 1200);
      this.synth.onvoiceschanged = () => { clearTimeout(timeout); resolve(this.synth.getVoices()); };
    });
  },
  collectVisibleText(){
    if (document.getElementById("lesson-modal").classList.contains("active")){
      return [document.getElementById("step-title").textContent, document.getElementById("step-content").textContent].join(". ");
    }
    if (document.getElementById("reward-modal").classList.contains("active")){
      return document.getElementById("reward-message").textContent;
    }
    if (document.getElementById("screen-course").classList.contains("active")){
      return document.getElementById("course-title").textContent + ". " + document.getElementById("course-intro").textContent;
    }
    return t("app_title") + ". " + t("main_goal");
  },
  async speak(text){
    this.stop();
    if (!text) return;
    if (window.CLOUD_TTS_ENDPOINT){
      try{
        const meta = LANGS[currentLang];
        const res = await fetch(window.CLOUD_TTS_ENDPOINT, { method:"POST",
          headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ text, language: meta.bcp47 }) });
        if (!res.ok) throw new Error("cloud tts failed");
        const blob = await res.blob();
        this.audio = new Audio(URL.createObjectURL(blob));
        this.audio.playbackRate = this.rate;
        this.audio.onended = () => { this.speaking = false; updateFab(false); };
        this.speaking = true; updateFab(true);
        await this.audio.play();
        return;
      } catch(e){ console.warn("Cloud TTS unavailable, using browser voice.", e); }
    }
    if (!this.synth){ alert("Read-aloud isn't supported on this browser."); return; }
    const meta = LANGS[currentLang];
    const voices = await this.waitForVoices();
    const exactMatch = voices.find(v => v.lang === meta.bcp47);
    const looseMatch = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(meta.bcp47.split("-")[0].toLowerCase()));
    const match = exactMatch || looseMatch;

    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = this.rate;
    if (match){
      // A voice for this language is installed on the device — use it.
      utter.voice = match;
      utter.lang = match.lang;
    } else {
      // No voice installed for this language: DO NOT set utter.lang to the
      // unsupported code, or some browsers (esp. Chrome/Android) silently
      // refuse to speak at all. Fall back to the device's default voice
      // instead, so the person still hears something rather than silence.
      if (voices.length) utter.voice = voices.find(v => v.default) || voices[0];
      console.warn(`No installed voice for ${meta.bcp47} — using default voice as fallback.`);
      showToast(`No ${meta.label.replace(/^\S+\s/, "")} voice is installed on this device — playing in the default voice instead.`);
    }
    utter.onend = () => { this.speaking = false; updateFab(false); };
    utter.onerror = () => { this.speaking = false; updateFab(false); };
    this.speaking = true; updateFab(true);
    this.synth.speak(utter);
  },
  stop(){ if (this.synth) this.synth.cancel(); if (this.audio){ this.audio.pause(); this.audio = null; } this.speaking = false; updateFab(false); }
};
function updateFab(isSpeaking){
  const fab = document.getElementById("fab-speak");
  fab.textContent = isSpeaking ? "⏹" : "🔊";
  fab.classList.toggle("speaking", isSpeaking);
}
function toggleSpeak(){ AppSpeech.speaking ? AppSpeech.stop() : AppSpeech.speak(AppSpeech.collectVisibleText()); }
function speakVisible(){ AppSpeech.speak(AppSpeech.collectVisibleText()); }

let toastTimer = null;
function showToast(msg){
  let toast = document.getElementById("app-toast");
  if (!toast){
    toast = document.createElement("div");
    toast.id = "app-toast";
    toast.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);"+
      "background:#20263B;color:#fff;padding:12px 18px;border-radius:14px;max-width:88%;"+
      "font-size:.85rem;text-align:center;z-index:2200;box-shadow:0 8px 20px rgba(0,0,0,.35);";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.display = "none"; }, 4500);
  refreshEmoji();
}

/* =====================================================================
   6. INIT
   ===================================================================== */
document.documentElement.setAttribute("lang", LANGS[currentLang].bcp47.split("-")[0]);
document.documentElement.setAttribute("dir", LANGS[currentLang].dir);
applyStaticTranslations();
renderHome();
refreshEmoji();
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
